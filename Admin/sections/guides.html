<div class="content-card">
    <div class="card-header">
        <h3>Gestión de Guías Turísticos</h3>
        <button class="btn btn-primary" id="btn-add-guide">
            + Agregar Guía
        </button>
    </div>
    <div class="card-body">
        <div class="filters-bar">
            <input type="text" placeholder="Buscar guías..." class="filter-input">
            <select class="filter-select">
                <option value="">Todos los estados</option>
                <option value="online">En línea</option>
                <option value="offline">Desconectado</option>
                <option value="busy">En Tour</option>
            </select>
        </div>
        <div class="guias-grid">
            <div class="guia-card">
                <div class="guia-header">
                    <div class="guia-avatar">👨‍🏫</div>
                    <div class="guia-status online">En línea</div>
                </div>
                <h3>Dr. Carlos López</h3>
                <p class="guia-specialty">Especialidad: Historia Maya</p>
                <div class="guia-stats">
                    <div class="stat"><span class="stat-value">245</span><span class="stat-label">Tours</span></div>
                    <div class="stat"><span class="stat-value">4.9</span><span class="stat-label">Rating</span></div>
                </div>
                <div class="guia-actions">
                    <button class="btn btn-icon" title="Editar">✏️</button>
                    <button class="btn btn-icon" title="Eliminar">🗑️</button>
                </div>
            </div>
            <div class="guia-card">
                <div class="guia-header">
                    <div class="guia-avatar">👩‍🏫</div>
                    <div class="guia-status busy">En Tour</div>
                </div>
                <h3>Dra. Elena Cruz</h3>
                <p class="guia-specialty">Especialidad: Arqueología</p>
                <div class="guia-stats">
                    <div class="stat"><span class="stat-value">180</span><span class="stat-label">Tours</span></div>
                    <div class="stat"><span class="stat-value">4.8</span><span class="stat-label">Rating</span></div>
                </div>
                <div class="guia-actions">
                    <button class="btn btn-icon" title="Editar">✏️</button>
                    <button class="btn btn-icon" title="Eliminar">🗑️</button>
                </div>
            </div>
            <div class="guia-card">
                <div class="guia-header">
                    <div class="guia-avatar">👨‍🏫</div>
                    <div class="guia-status offline">Desconectado</div>
                </div>
                <h3>Prof. Miguel Sánchez</h3>
                <p class="guia-specialty">Especialidad: Arquitectura</p>
                <div class="guia-stats">
                    <div class="stat"><span class="stat-value">95</span><span class="stat-label">Tours</span></div>
                    <div class="stat"><span class="stat-value">4.7</span><span class="stat-label">Rating</span></div>
                </div>
                <div class="guia-actions">
                    <button class="btn btn-icon" title="Editar">✏️</button>
                    <button class="btn btn-icon" title="Eliminar">🗑️</button>
                </div>
            </div>
        </div>
    </div>
</div>
